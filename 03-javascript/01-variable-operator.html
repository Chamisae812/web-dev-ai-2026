<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>변수와 연산자</h1>
    <h2>1. var, let, const</h2>
    <script>
      // 변수 : 값을 담는 공간
      // 변수명 <- 값
      // var : 예전 (사용x)
      var oldVar = 1;

      // let : 변수 - 값을 바꿀 수 있음 가끔 사용
      let nickname = "안지훈";
      console.log(nickname);
      nickname = "아무개";
      console.log(nickname);

      // const : 상수 (값을 바꿀 수 없음)자주 사용
      const name = "홍길동";
      console.log(name);
    </script>
    <h2>자료형과 typeof</h2>
    <script>
      const userID = "만두"; // "",'' 문자열 -string
      console.log(typeof userID);
      const age = 15; //숫자 - number
      console.log(typeof age);
      let check = true; // 논리형 - boolean
      check = false;
      console.log(typeof check);
      let unknown; // 값이 정의 되지 않음 - undefined
      console.log(unknown);
      let isNone = null; // 값이 없음
      console.log(isNone);
    </script>

    <h2>문자열 & 템플릿 리터럴</h2>
    <script>
      const hobby = "요리";
      console.log("내 취미는 " + hobby + "입니다");
      console.log(`내 취미는 ${hobby}입니다`); //tab키 위에 있음('' 얘랑 다름)
    </script>

    <h2>숫자</h2>
    <script>
      const num1 = 10;
      const num2 = 3;
      console.log(num1 + num2);
      console.log(num1 - num2);
      console.log(num1 * num2);
      console.log(num1 / num2);
      console.log(num1 % num2); //나머지 값
      console.log(num1 ** num2); //제곱

      //문자 > 숫자
      console.log(Number("100"));
      console.log(Number("Hello")); //NaN

      //숫자 > 문자
      console.log(String(100));

      //소수 제거
      console.log(parseInt(3.9)); // 3

      //문자를 실수로 변환
      console.log(parseFloat("3.14")); //3.14
    </script>

    <h2>5. boolean과 비교 연산자</h2>
    <script>
      console.log(true);
      console.log(false);

      //boolean 변환
      console.log(Boolean("hello")); //true
      console.log(Boolean("")); //false

      console.log(Boolean(1)); //true
      console.log(Boolean(0)); //false

      const a = 100;
      const b = "100";
      //100이랑 "100"이랑 같은가?
      console.log(a == b); //true
      console.log(a === b); //false (숫자 100이랑 문자 100 비교 - 타입까지 비교)

      //100 이랑 "100"이랑 같지 않은가?
      console.log(a != b); //false
      console.log(a !== b); //true (타입까지 비교)

      const c = 200;
      console.log(a < c); // 100 < 200 -true
      console.log(a > c); // 100 > 200 -false
      console.log(a <= c);
      console.log(a >= c);
    </script>

    <h2>6. 논리 연산자</h2>
    <script>
      const x = 10;
      const y = 20;

      // && : 그리고(and) - 둘 다 true여야 true
      console.log(x < 15 && y > 10); //true
      console.log(x > 15 && y > 10); //false

      // || : 또는(or) - 둘 중 하나
      console.log(x > 15 || y > 10); //true
      console.log(x > 15 || y > 10); //true

      // ! : 부정(not)
      console.log(!false); //true
      console.log(!!true); //true

      console.log("javascript" && 12345); //true && true = true -> 뒤에 값인 12345가 표시
      console.log("" && 12345); //false && true = false, false && false = false
      //결과값이 ""인 이유가 앞에서 이미 false이면 어차피 false이기 때문에 뒤 값 계산X
      console.log(null || "js"); //JS - 앞에가 false이므로 뒤에라도 true인지 확인
      console.log(1 || "js"); //1 - 앞에서 이미 true이면 어차피 true이기 땜에 뒤 값 계산X
    </script>
  </body>
</html>
