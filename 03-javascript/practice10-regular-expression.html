<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>register</title>
    <script src="./practice10-regular-expression.js" defer></script>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        background-color: rgb(248, 248, 248);
        padding: 24px 16px;
      }

      section {
        margin-top: 20px;
        width: min(700px, 100%);
        min-height: 800px;
        border: 1px solid rgb(189, 189, 189);
        border-radius: 25px;
        display: flex;
        flex-direction: column;
        align-items: center;
        background-color: white;
        padding: 10px 0 30px;
      }

      form {
        width: min(600px, calc(100% - 32px));
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      ul {
        width: 100%;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      li {
        width: 100%;
      }

      input {
        width: 100%;
        height: 45px;
        border-radius: 10px;
        border: 1px solid rgb(189, 189, 189);
        padding: 0 10px;
        font-size: 1rem;
      }

      .email-row {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .email-row input {
        flex: 1;
      }

      .email-at {
        flex: none;
        font-weight: 700;
        color: #555;
      }

      p {
        margin-top: 5px;
        margin-bottom: 20px;
        font-size: 1rem;
        color: rgb(95, 95, 95);
      }

      .button-wrap {
        width: 100%;
        display: flex;
        gap: 12px;
        margin-top: 10px;
      }

      .button-wrap button {
        flex: 1;
        height: 46px;
        border: none;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          opacity 0.15s ease;
      }

      #regi {
        background-color: #1f6feb;
        color: #fff;
      }

      #cancle {
        background-color: #e9ecef;
        color: #333;
      }

      .button-wrap button:hover {
        opacity: 0.92;
      }

      .button-wrap button:active {
        transform: translateY(1px);
      }

      @media (max-width: 768px) {
        body {
          padding: 16px 12px;
        }

        section {
          min-height: auto;
          border-radius: 18px;
          padding: 8px 0 20px;
        }

        h1 {
          font-size: 1.5rem;
          margin: 20px 0;
        }

        p {
          font-size: 0.92rem;
          margin-bottom: 16px;
        }
      }

      @media (max-width: 500px) {
        input {
          height: 42px;
          font-size: 0.95rem;
        }

        .email-row {
          gap: 6px;
        }

        .button-wrap {
          flex-direction: column;
        }

        .button-wrap button {
          height: 45px;
          width: 100%;
          flex: none;
        }
      }
    </style>
  </head>
  <body>
    <section>
      <h1>회원가입</h1>

      <form id="register-form" action="#" method="post">
        <ul>
          <li>
            <input type="text" id="id" placeholder="아이디를 입력해주세요" />
            <p id="idrslt">
              영문자로 시작하고 영문자와 숫자 조합으로 4~12자 이내
            </p>
          </li>
          <li>
            <input
              type="password"
              id="pw"
              placeholder="비밀번호를 입력해주세요"
            />
            <p id="pwrslt">영문자, 숫자, 특수문자 조합으로 8~15자 이내</p>
          </li>
          <li>
            <input
              type="password"
              id="rpw"
              placeholder="비밀번호를 다시 입력해주세요"
            />
            <p id="rpwrslt">위 비밀번호와 동일하게</p>
          </li>
          <li>
            <input type="text" id="name" placeholder="이름을 입력해주세요" />
            <p id="nmrslt">한글 2자 이상</p>
          </li>
          <li>
            <div class="email-row">
              <input type="text" id="email-id" placeholder="이메일 주소" />
              <span class="email-at">@</span>
              <input
                type="text"
                id="email-domain"
                placeholder="도메인 (예: naver.com)"
              />
            </div>
            <p id="erslt">이메일 형식</p>
          </li>
          <li>
            <input type="tel" id="tel" placeholder="전화번호를 입력해주세요" />
            <p id="trslt">전화번호 형식</p>
          </li>
        </ul>

        <div class="button-wrap">
          <button id="regi" type="submit">회원가입</button>
          <button id="cancle" type="reset">취소</button>
        </div>
      </form>
    </section>
  </body>
</html>
