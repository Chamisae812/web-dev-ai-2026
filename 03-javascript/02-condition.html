    <h2>1. if / else</h2>
    <script>
      // if(조건) {조건이 true} else {조건이 false} else 생략 가능
      let age = 9;
      if (age > 19) {
        console.log("성인");
      } else {
        console.log("미성년자");
      }

      // 삼항 연산자 : 조건 ? 조건이 true : 조건이 true
      const result = age > 19 ? "성인" : "미성년자";
      console.log(result);
    </script>

    <h2>2. else if</h2>
    <script>
      /* if(조a) {
        조a가 true
      } elsr if(조b) {
        조a가 false이면서, 조b가 true
      } elsr if(조c) {
        조a와 조b가 false이면서, 조건c가 true
       } else {
        모든 조건이 false
        }
        else if는 여러개 가능
       */
      //   20세 이상이면 성인, 14세 이상이면 청소년
      //   8세 이상이면 어린이, 그 외에는 유아
      //const age = prompt("숫자를 입력해주세요.")
      let result2;
      if (age > 19) {
        result2 = "성인";
      } else if (age > 14) {
        result2 = "청소년";
      } else if (age > 8) {
        result2 = "어린이";
      } else {
        result2 = "유아";
      }
      console.log(result2);
      //  가독성 떨어짐 가급적 ㄴㄴ
      result2 =
        age >= 20
          ? "성인"
          : age >= 14
            ? "청소년"
            : age >= 8
              ? "어린이"
              : "유아";
      console.log(result2);
    </script>

    <script>

      // const number = prompt("숫자를 입력해주세요.");
      const number = 2;
      // 짝수라는 건 2로 나누었을 때 나머지가 0
      // number값이 짝수 이면 "짝수", 홀수 이면 "홀수"
      // 그게 아니면 "숫자가 아닙니다."
      if (number % 2 === 0) {
        console.log("짝수");
      } else if (number % 2 === 1) {
        console.log("홀수");
      } else {
        console.log("숫자가 아닙니다");
      }

      /*switch(데이터) {
        case 조건a(값) :
            조건a가 true
            break;
        case 조건b(값) :
            조건b가 true
            break;
        default:
            모든 조건이 false
      */
      switch (number % 2) {
        case 0:
          console.log("짝수");
          break;
        case 1:
          console.log("홀수");
          break;
        default:
          console.log("숫자가 아닙니다");
      }
    </script>
